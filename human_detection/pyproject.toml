[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "human-detection"
version = "0.1.0"
description = "Kiosk user (human) detection: YOLOX + ByteTrack + engagement, as a library or HTTP sidecar"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.10,<4.12",
  "onnxruntime>=1.19,<2",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "supervision>=0.25,<0.28",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# 0.10.35 introduced an undocumented Clearcut network attempt; keep kiosk inference offline.
head-pose = ["mediapipe>=0.10.14,<=0.10.21"]
visual-calibration = ["opencv-contrib-python>=4.10,<4.12"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[project.scripts]
kiosk-vision = "kiosk_vision.cli:main"
human-detection = "human_detection.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kiosk_vision", "src/human_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".uv-cache"]

[tool.uv]
required-version = ">=0.8.0,<1"
cache-dir = ".uv-cache"
